{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-reviewer.secretName" . }}
  labels:
    {{- include "code-reviewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.embedderApiKey }}
  EMBEDDER_API_KEY: {{ .Values.secrets.embedderApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.gitlabToken }}
  GITLAB_TOKEN: {{ .Values.secrets.gitlabToken | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseLabToken }}
  DBLAB_TOKEN: {{ .Values.secrets.databaseLabToken | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseLabVerifyToken }}
  DBLAB_VERIFY_TOKEN: {{ .Values.secrets.databaseLabVerifyToken | quote }}
  {{- end }}
{{- end }}
