version: "3.8"

services:
  # =============================================================================
  # Code Reviewer Application
  # =============================================================================
  code-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: yourorg/code-reviewer:${VERSION:-latest}
    container_name: code-reviewer
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # Prometheus metrics
    environment:
      # Service
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - LOG_FORMAT=text

      # Temporal
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=code-review-queue

      # LLM (Ollama)
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5-coder:32b

      # Embedder
      - EMBEDDER_PROVIDER=ollama
      - EMBEDDER_BASE_URL=http://ollama:11434
      - EMBEDDER_MODEL=nomic-embed-text

      # Vector Store
      - VECTORSTORE_TYPE=memory
      - VECTORSTORE_STORE_PATH=/app/data/vectorstore.json

      # Tracing (optional)
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - TRACING_ENDPOINT=jaeger:4317

      # GitLab (optional)
      - GITLAB_ENABLED=${GITLAB_ENABLED:-false}
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
    volumes:
      - code-reviewer-data:/app/data
    depends_on:
      temporal:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - code-reviewer-network

  # =============================================================================
  # Temporal Server
  # =============================================================================
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC
      - "7234:7234"   # Web UI (if using all-in-one)
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "default"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - code-reviewer-network

  temporal-db:
    image: postgres:15-alpine
    container_name: temporal-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - code-reviewer-network

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - code-reviewer-network

  # =============================================================================
  # Ollama LLM Server
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - code-reviewer-network

  # =============================================================================
  # Observability Stack (Optional)
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "16686:16686"  # Web UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - observability
    restart: unless-stopped
    networks:
      - code-reviewer-network

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    profiles:
      - observability
    restart: unless-stopped
    networks:
      - code-reviewer-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    profiles:
      - observability
    restart: unless-stopped
    networks:
      - code-reviewer-network

  # =============================================================================
  # Milvus Vector Database (Optional - for production)
  # =============================================================================
  milvus:
    image: milvusdb/milvus:v2.3.5
    container_name: milvus
    ports:
      - "19530:19530"
      - "9001:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    profiles:
      - milvus
    restart: unless-stopped
    networks:
      - code-reviewer-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    profiles:
      - milvus
    restart: unless-stopped
    networks:
      - code-reviewer-network

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: milvus-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    profiles:
      - milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - code-reviewer-network

volumes:
  code-reviewer-data:
  temporal-db-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  milvus-data:
  etcd-data:
  minio-data:

networks:
  code-reviewer-network:
    driver: bridge
